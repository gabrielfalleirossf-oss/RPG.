<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editar ficha — Mestre Abismo</title><link rel="stylesheet" href="../../../mestre.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><script src="../../../supabase-config.js?v=3" defer></script><script src="../../../auth-guard.js" defer></script><script src="../../../mestre.js" defer></script></head><body data-rpg="abismo" data-perfil="mestre" data-master-page="editar"><main class="pagina-mestre" hidden><nav class="mestre-topo"><a class="mestre-voltar" href="../personagens/index.html">← Personagens</a><span class="mestre-marca">ABISMO · MESTRE</span></nav><header class="mestre-cabecalho"><small id="campanha-mestre"></small><h1>Editar ficha</h1></header><p id="aviso-mestre" class="aviso-mestre"></p><section class="painel-edicao"><div class="foto-edicao"><img id="foto-mestre" alt="Foto do personagem" hidden><div id="foto-mestre-vazia">?</div></div><form id="form-ficha-mestre" class="form-mestre"><div class="campo-mestre largo"><label>Nome<input name="nome" maxlength="80" required></label></div><div class="campo-mestre largo"><label>História<textarea name="historia"></textarea></label></div><div class="campo-mestre"><label>Personalidade<textarea name="personalidade"></textarea></label></div><div class="campo-mestre"><label>Objetivos<textarea name="objetivos"></textarea></label></div><div class="campo-mestre largo"><label>Anotações<textarea name="anotacoes"></textarea></label></div><div class="campo-mestre"><label>Nível<input name="nivel" type="number" min="0" max="100"></label></div><div class="campo-mestre"><label>Experiência (%)<input name="experiencia" type="number" min="0" max="100"></label></div><div class="campo-mestre"><label>Vida atual<input name="vida_atual" type="number" min="0"></label></div><div class="campo-mestre"><label>Vida máxima<input name="vida_max" type="number" min="1"></label></div><div class="atributos-mestre"><h2>Atributos</h2><div class="grade-atributos-mestre"><label class="campo-atributo">Agilidade<input name="agilidade" type="number" min="0" max="5"></label><label class="campo-atributo">Força<input name="forca" type="number" min="0" max="5"></label><label class="campo-atributo">Apt. Mágica<input name="apt_magica" type="number" min="0" max="5"></label><label class="campo-atributo">Presença<input name="presenca" type="number" min="0" max="5"></label><label class="campo-atributo">Resistência<input name="resistencia" type="number" min="0" max="5"></label></div><div class="resumo-atributos"><strong id="pontos-restantes-mestre"></strong><span>Energia Mágica: <strong id="energia-calculada"></strong></span></div></div><div class="acoes-mestre"><button id="salvar-ficha-mestre" class="mestre-salvar" type="submit">Salvar alterações</button></div></form></section></main></body></html>
