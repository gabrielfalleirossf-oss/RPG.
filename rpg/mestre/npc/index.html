<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar NPC/Monstro — Abismo</title><link rel="stylesheet" href="../../../personagem.css"><link rel="stylesheet" href="../../../npc-criacao-v11.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><script src="../../../supabase-config.js?v=3" defer></script><script src="../../../auth-guard.js" defer></script><script src="../../../npc-criacao-v11.js" defer></script></head><body data-rpg="abismo" data-perfil="mestre"><div class="fundo"></div><main class="pagina" hidden><div class="topo"><a id="voltar-npcs" class="voltar" href="../personagens/index.html">← Voltar</a><span class="marca">ABISMO · MESTRE</span></div><header class="cabecalho"><p id="campanha-atual"></p><h1>Criação de NPC/Monstro</h1></header><section class="painel"><form id="form-npc"><div class="grade-form"><label class="upload"><input name="foto" type="file" accept="image/png,image/jpeg,image/webp"><img id="preview" class="preview" alt="Prévia"><span class="upload-info"><span class="upload-icone">↑</span><strong>Enviar foto</strong><small>PNG, JPG ou WEBP · até 5 MB</small></span></label><div class="campos"><div class="campo largo"><label>Nome</label><input name="nome" type="text" maxlength="100" placeholder="Como ele será chamado?" required></div><div class="campo largo historia"><label>História</label><textarea name="historia" maxlength="5000" placeholder="Origem, passado e acontecimentos..."></textarea><span class="contador"></span></div><div class="campo"><label>Personalidade</label><textarea name="personalidade" maxlength="2500" placeholder="Como ele pensa e age?"></textarea><span class="contador"></span></div><div class="campo"><label>Objetivos</label><textarea name="objetivos" maxlength="2500" placeholder="O que ele deseja alcançar?"></textarea><span class="contador"></span></div><div class="campo largo"><label>Anotações do mestre</label><textarea name="anotacoes" maxlength="5000" placeholder="Segredos, estratégias e detalhes..."></textarea><span class="contador"></span></div><div class="npc-campos-extra"><div class="campo"><label>Tipo</label><select name="tipo"><option>NPC</option><option>Monstro</option></select></div><div class="campo"><label>Drops ao morrer</label><textarea name="drops" maxlength="5000" placeholder="Um item ou recompensa por linha"></textarea><span class="contador"></span></div><div class="campo"><label>XP ao morrer</label><input name="xp_recompensa" type="number" min="0" value="0"></div></div></div></div><p id="mensagem" class="mensagem"></p><div class="acoes"><button id="criar-npc" class="botao" type="submit">Criar NPC/Monstro</button><button id="ir-ficha" class="botao principal" type="button" disabled>Ir para a ficha</button></div></form></section></main></body></html>
