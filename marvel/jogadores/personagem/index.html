<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criação de personagem</title><link rel="stylesheet" href="../../../personagem.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><script src="../../../supabase-config.js?v=3" defer></script><script src="../../../auth-guard.js" defer></script><script src="../../../personagem.js" defer></script></head><body data-rpg="marvel" data-perfil="jogador" data-pagina="criar"><div class="fundo"></div><main class="pagina" hidden><div class="topo"><a class="voltar" href="../index.html">← Voltar</a><span class="marca">MARVEL RPG</span></div><header class="cabecalho"><p id="campanha-atual"></p><h1>Criação de personagem</h1></header><section class="painel"><form id="form-personagem"><div class="grade-form"><label class="upload"><input id="foto" type="file" accept="image/png,image/jpeg,image/webp"><img id="preview" class="preview" alt="Prévia da foto"><span class="upload-info"><span class="upload-icone">↑</span><strong>Enviar foto</strong><small>PNG, JPG ou WEBP · até 5 MB</small></span></label><div class="campos"><div class="campo largo"><label for="nome">Nome do personagem</label><input id="nome" name="nome" type="text" maxlength="80" placeholder="Como ele será chamado?" required></div><div class="campo largo historia"><label for="historia">História</label><textarea id="historia" name="historia" maxlength="5000" placeholder="Conte de onde ele veio e o que viveu até aqui..."></textarea><span class="contador"></span></div><div class="campo"><label for="personalidade">Personalidade</label><textarea id="personalidade" name="personalidade" maxlength="2500" placeholder="Como ele pensa, sente e reage?"></textarea><span class="contador"></span></div><div class="campo"><label for="objetivos">Objetivos durante a campanha</label><textarea id="objetivos" name="objetivos" maxlength="2500" placeholder="O que ele deseja alcançar?"></textarea><span class="contador"></span></div><div class="campo largo"><label for="anotacoes">Anotações</label><textarea id="anotacoes" name="anotacoes" maxlength="5000" placeholder="Segredos, ideias e detalhes importantes..."></textarea><span class="contador"></span></div></div></div><p id="mensagem" class="mensagem" role="status"></p><div class="acoes"><button id="criar-personagem" class="botao" type="submit">Criar personagem</button><button id="ir-ficha" class="botao principal" type="button" disabled>Ir para a ficha</button></div></form></section></main></body></html>
